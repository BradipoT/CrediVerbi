{% extends "base.html" %}
{% block title %}Nouvelle personne — CrediVerbi{% endblock %}
{% block content %}
<h2>Nouvelle personne</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/new/person">
  <label>Nom <input type="text" name="name" required maxlength="200"></label>
  <label>Fonction / rôle <input type="text" name="role" maxlength="200"></label>
  <label>Organisation
    <select name="organization_id">
      <option value="">— aucune —</option>
      {% for org in organizations %}
      <option value="{{ org.id }}">{{ org.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label><input type="checkbox" name="is_public_figure" value="on"> Personnalité publique (obligatoire pour enregistrer des déclarations à son sujet)</label>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
