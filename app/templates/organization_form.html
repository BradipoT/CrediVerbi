{% extends "base.html" %}
{% block title %}Nouvelle organisation — CrediVerbi{% endblock %}
{% block content %}
<h2>Nouvelle organisation</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/new/organization">
  <label>Nom <input type="text" name="name" required maxlength="200"></label>
  <label>Type
    <select name="kind">
      <option value="media">Média</option>
      <option value="parti politique">Parti politique</option>
      <option value="gouvernement">Gouvernement / institution</option>
      <option value="autre" selected>Autre</option>
    </select>
  </label>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
