services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crediverbi
      POSTGRES_PASSWORD: crediverbi
      POSTGRES_DB: crediverbi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crediverbi -d crediverbi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
